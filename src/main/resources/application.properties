spring.application.name=pamtenproject

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Database Configuration (Azure)
spring.datasource.url=jdbc:sqlserver://pamten-re-server.database.windows.net:1433;database=Recruitment_Platform;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=sqladmin@pamten-re-server
spring.datasource.password=R3cruit@Edge#2025SQL!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=db_owner
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Management endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

